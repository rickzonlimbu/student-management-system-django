{% extends 'base.html' %}
{% block content %}

<div class="content container-fluid">

  <!-- Page Header -->
  <div class="page-header">
    <div class="row align-items-center">
      <div class="col">
        <h3 class="page-title">Add Result</h3>
        <ul class="breadcrumb">
          <li class="breadcrumb-item"><a href="#">Result</a></li>
          <li class="breadcrumb-item active">Add Result</li>
        </ul>
      </div>
    </div>
  </div>

  {% include 'includes/messages.html' %}

  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-body">

          {% if action is None %}
          <!-- ================= FETCH STUDENT FORM ================= -->
          <form method="post" action="?action=Show-Students">
            {% csrf_token %}
            <div class="row">

              <div class="col-12">
                <h5 class="form-title"><span>Add Result</span></h5>
              </div>

              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label>Subject</label>
                  <select class="form-control" name="subject_id" required>
                    <option value="">Select Subject</option>
                    {% for i in subjects %}
                    <option value="{{ i.id }}">{{ i.name }}</option>
                    {% endfor %}
                  </select>
                </div>
              </div>

              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label>Batch</label>
                  <select class="form-control" name="batch_year_id" required>
                    <option value="">Select Batch</option>
                    {% for i in batch_year %}
                    <option value="{{ i.id }}">{{ i.batch_start }} To {{ i.batch_end }}</option>
                    {% endfor %}
                  </select>
                </div>
              </div>

              <div class="col-12 mt-3">
                <button type="submit" class="btn btn-primary">Fetch Students</button>
              </div>

            </div>
          </form>

          {% else %}
          <!-- ================= ADD RESULT FORM ================= -->
          <form method="post" action="{% url 'staff_save_result' %}">
            {% csrf_token %}
            <div class="row">

              <div class="col-12">
                <h5 class="form-title"><span>Subject Information</span></h5>
              </div>

              <!-- Subject -->
              <div class="col-12 col-sm-6">
              <div class="form-group">
                <label>Subject</label>

                <!-- visible but locked -->
                <select class="form-control" disabled>
                  <option>{{ get_subject }}</option>
                </select>

                <!-- ACTUAL value sent to backend -->
                <input type="hidden" name="subject_id" value="{{ get_subject.id }}">
              </div>
            </div>


              <!-- Batch -->
              <div class="col-12 col-sm-6">
              <div class="form-group">
                <label>Batch</label>

                <!-- visible but locked -->
                <select class="form-control" disabled>
                  <option>{{ get_batch_year }}</option>
                </select>

                <!-- ACTUAL value sent to backend -->
                <input type="hidden" name="batch_year_id" value="{{ get_batch_year.id }}">
              </div>
            </div>


              <!-- Student List -->
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label>Student List</label>
                  <select class="form-control" name="student_id" required>
                    <option value="">Select Student</option>
                    {% for i in students %}
                    <option value="{{ i.id }}">
                      ID{{i.id}} : {{ i.admin.first_name }} {{ i.admin.last_name }}
                    </option>
                    {% endfor %}
                  </select>
                </div>
              </div>

              <!-- Assignment Marks -->
              <div class="col-12 col-sm-3">
                <div class="form-group">
                  <label>Assignment Marks</label>
                  <input type="number" class="form-control" name="assignment_mark" required>
                </div>
              </div>

              <!-- Exam Marks -->
              <div class="col-12 col-sm-3">
                <div class="form-group">
                  <label>Exam Marks</label>
                  <input type="number" class="form-control" name="exam_mark" required>
                </div>
              </div>

              <!-- Submit -->
              <div class="col-12 mt-3">
                <button type="submit" class="btn btn-primary">Add Result</button>
              </div>

            </div>
          </form>
          {% endif %}

        </div>
      </div>
    </div>
  </div>

</div>

{% endblock %}
